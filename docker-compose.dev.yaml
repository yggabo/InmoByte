name: API-REST-inmoByte

services:
  mariadb:
    image: mariadb:11
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - ./data/mariadb/db:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_test_db.sql:ro

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"

  backend:
    image: python:3.14-slim
    restart: on-failure
    env_file: .env
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    ports:
      - "${FLASK_RUN_PORT}:5000"
    depends_on:
      mariadb:
        condition: service_started
    volumes:
      - ./requirements.txt:/tmp/requirements.txt
      - ./:/app
    command: bash -c "\
      pip install --no-cache-dir -r /tmp/requirements.txt && \
      cd /app && \
      gunicorn -w 1 --bind 0.0.0.0:5000 --log-level=DEBUG run:app --reload"